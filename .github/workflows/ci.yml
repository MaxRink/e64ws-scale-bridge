name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'

  php:
    name: On-device PHP tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run PHP endpoint tests in Docker
        run: sh tools/run_php_tests.sh

  uninstall:
    name: Uninstall script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run ondevice/uninstall.sh in a throwaway container
        run: python -m unittest tests.test_ondevice_shell -v
